<style>
  html, body {

    overflow: hidden;

  .screen {

    height: 100%;

  }
  .slide {

    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
  }
  .slide.is-on { opacity: 1; }
  .slide:not(.is-on),
  .slide:not(.is-on) * {

  }
  .custom {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;

  .custom-fx i:nth-of-type(5) { left: 51%; animation-duration: 14s; animation-delay: -11s; }
  .custom-fx i:nth-of-type(6) { left: 63%; width: 6.4vh; height: 6.4vh; background: radial-gradient(circle, var(--glow, rgba(255, 255, 255, 0.65)), rgba(255, 255, 255, 0) 70%); animation-name: mote-a; animation-duration: 18s; animation-delay: -3s; }
  .custom-fx i:nth-of-type(7) { left: 74%; animation-duration: 11s; animation-delay: -7s; }
  .custom-fx i:nth-of-type(8) { left: 84%; width: 5.4vh; height: 5.4vh; background: radial-gradient(circle, var(--glow, rgba(255, 255, 255, 0.6)), rgba(255, 255, 255, 0) 70%); animation-name: mote-b; animation-duration: 16s; animation-delay: -1s; }
  .custom-fx i:nth-of-type(9) { left: 93%; animation-duration: 13s; animation-delay: -5s; }
  .custom-fx.fx-spark i:nth-of-type(n) {

    height: 1.6vh;
    border-radius: 1px;
    background: var(--glow, #fff);

    height: 2.6vh;

    height: 12vh;

    height: 16vh;
    border-radius: 999px;

  }
  .custom-beam,
  .custom-spark,
  .custom-puff,

  .custom-beam {
    position: absolute;

  <script>
    var last = "";

    function pesos(value) {
      var digits = String(Math.round(Number(value) || 0));
      var out = "";
      for (var i = 0; i < digits.length; i++) {
        if (i > 0 && (digits.length - i) % 3 === 0) out += ".";
        out += digits.charAt(i);
      }
      return out;
    }

    function add(parent, tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      parent.appendChild(node);
      return node;
    }

    function focusMotion(sheetId, keyName, classPrefix, count) {
      var sheet = document.getElementById(sheetId);
      if (!sheet) {
        sheet = document.createElement("style");
        sheet.id = sheetId;
        document.head.appendChild(sheet);
      }
      var rest = 0.985;
      var grow = count <= 2 ? 1.07 : count === 3 ? 1.055 : 1.04;
      var duration = count * 8;
      var slice = 100 / count;
      var rise = Math.min(18, slice * 0.7);
      var peak = slice;
      var fall = Math.min(97, slice + rise);
      var css = "@keyframes " + keyName + "{";
      css += "0%{transform:scale(" + rest + ");z-index:1}";
      css += rise.toFixed(2) + "%{transform:scale(" + grow + ");z-index:3}";
      css += peak.toFixed(2) + "%{transform:scale(" + grow + ");z-index:3}";
      css += fall.toFixed(2) + "%{transform:scale(" + rest + ");z-index:1}";
      css += "100%{transform:scale(" + rest + ");z-index:1}}";
      for (var i = 0; i < count; i++) {
        css += "." + classPrefix + (i + 1) + "{animation:" + keyName + " " + duration + "s cubic-bezier(0.4, 0, 0.6, 1) " + (-i * duration / count) + "s infinite}";
      }
      sheet.textContent = css;
    }

    function motion(count) {
      focusMotion("rail-motion", "rail-focus", "life-", count);
    }

    function render(data) {
      var rail = document.getElementById("rail");
      rail.textContent = "";

      var shown = [];
      (data.products || []).forEach(function (item) {
        if (!item) return;
        if (!item.productId && !String(item.name || "").trim()) return;
        shown.push(item);
      });
      var count = Math.max(1, Math.min(4, shown.length || 1));
      var columns = "";
      for (var c = 0; c < count; c++) columns += (columns ? " " : "") + "1fr";
      rail.style.gridTemplateColumns = columns;
      rail.className = rail.className.replace(/\bn-[2-4]\b/g, "").replace(/\s+/g, " ").trim();
      rail.className += " n-" + count;
      motion(count);

      shown.forEach(function (item, index) {
        var card = add(rail, "article", "card");
        var cluster = add(card, "div", "cluster life-" + (index + 1));
        var stage = add(cluster, "div", "stage");
        var photo = document.createElement("img");
        photo.src = item.image;
        photo.alt = item.name || "";
        stage.appendChild(photo);

        var copy = add(cluster, "div", "copy");
        var info = add(copy, "div", "info");
        add(info, "div", "brand", item.brand || "");
        add(info, "div", "name", item.name || "");
        add(info, "div", "detail", item.detail || "");
        var list = Number(item.listPrice) || 0;
        var price = Number(item.price) || 0;
        var discount = list > price && price > 0 ? Math.round((1 - price / list) * 100) : 0;
        var ticket = add(copy, "div", "ticket");
        var flags = add(ticket, "div", "flags");
        var mark = discount ? "−" + discount + "%" : (item.badge || "");
        add(flags, "span", "off", mark);
        var amount = add(ticket, "div", "price");
        add(amount, "span", "", "$");
        amount.appendChild(document.createTextNode(pesos(price)));
        if (discount) add(ticket, "div", "was", "antes $" + pesos(list));
      });
    }

    function apply(data) {
      var key = JSON.stringify(data);
      if (key === last) return;
      last = key;
      render(data);
      paintPieces(pieces);
    }

    var pieces = null;
    var piecesKey = "";

    function setText(selector, value) {
      var node = document.querySelector(selector);
      if (!node) return;
      var text = value == null ? "" : String(value);
      if (node.textContent !== text) node.textContent = text;
    }

    function paintShapes(node, shapes, names) {
      if (!node || !shapes) return;
      var parts = node.className.split(" ");
      var next = [];
      for (var i = 0; i < parts.length; i++) {
        if (!parts[i] || parts[i].indexOf("no-") === 0) continue;
        next.push(parts[i]);
      }
      for (var j = 0; j < names.length; j++) {
        if (shapes[names[j]] === false) next.push("no-" + names[j]);
      }
      node.className = next.join(" ");
    }

    function paintPieces(data) {
      if (!data) return;
      var offer = data.offer || {};
      var fresh = data.fresh || {};
      setText(".offer-kicker", offer.kicker);
      setText(".offer-hero", offer.hero);
      setText(".offer-title", offer.title);
      setText(".offer-detail", offer.detail);
      setText(".fresh-kicker", fresh.kicker);
      setText(".fresh-hero", fresh.hero);
      setText(".fresh-seal strong", fresh.seal);
      setText(".fresh-seal em", fresh.sealDetail);
      setText(".fresh-title", fresh.title);
      setText(".fresh-detail", fresh.detail);
      paintShapes(document.querySelector(".offer"), offer.shapes, ["spine", "pill", "halo", "particles", "shine"]);
      paintShapes(document.querySelector(".fresh"), fresh.shapes, ["spine", "pill", "seal", "rings", "particles", "mist", "shine"]);
      paintShapes(document.getElementById("rail"), (data.rail || {}).shapes, ["spine", "frames", "gleam"]);
    }

    function applyPieces(data) {
      var key = JSON.stringify(data);
      if (key === piecesKey) return;
      piecesKey = key;
      pieces = data;
      paintPieces(data);
    }

    function pull() {
      fetch("/api/content", { cache: "no-store" })
        .then(function (response) { return response.json(); })
        .then(apply)
        .catch(function () {});
    }

    function pullPieces() {
      fetch("/api/elements", { cache: "no-store" })
        .then(function (response) { return response.json(); })
        .then(applyPieces)
        .catch(function () {});
    }

    var slides = [
      document.getElementById("slide-rail"),
      document.getElementById("slide-offer"),
      document.getElementById("slide-fresh")
    ];
    var slideIds = ["rail", "offer", "fresh"];
    var slideNodes = {
      rail: document.getElementById("slide-rail"),
      offer: document.getElementById("slide-offer"),
      fresh: document.getElementById("slide-fresh")
    };
    var customSlide = document.getElementById("slide-custom");
    var shown = "rail";
    var order = ["rail", "offer", "fresh"];
    var playback = { visible: true, rail: true, offer: true, fresh: true };
    var durations = { rail: 5, offer: 5, fresh: 5 };
    var creations = [];
    var creationsKey = "";
    var advanceTimer = null;
    var playbackKey = "";

    function hexRgba(hex, alpha) {
      var text = String(hex || "").replace("#", "");
      if (text.length !== 6) return "rgba(255,255,255," + alpha + ")";
      return "rgba(" + parseInt(text.substring(0, 2), 16) + "," + parseInt(text.substring(2, 4), 16) + "," + parseInt(text.substring(4, 6), 16) + "," + alpha + ")";
    }

    function colorLight(hex) {
      var text = String(hex || "").replace("#", "");
      if (text.length !== 6) return 0;
      var red = parseInt(text.substring(0, 2), 16);
      var green = parseInt(text.substring(2, 4), 16);
      var blue = parseInt(text.substring(4, 6), 16);
      return (red * 299 + green * 587 + blue * 114) / 1000;
    }

    function customMotion(count) {
      if (count < 2) return;
      focusMotion("custom-rail-motion", "custom-rail-focus", "c-life-", count);
    }

    function renderProductRail(found) {
      var items = found.products || [];
      var count = Math.max(2, Math.min(4, items.length || found.count || 3));
      items = items.slice(0, count);
      var rail = document.createElement("div");
      rail.className = "rail custom-rail n-" + items.length + (customSlide.style.background ? " is-plain" : "");
      var columns = "";
      for (var c = 0; c < items.length; c++) columns += (columns ? " " : "") + "1fr";
      rail.style.gridTemplateColumns = columns;
      customMotion(items.length);
      items.forEach(function (item, index) {
        var card = add(rail, "article", "card");
        var cluster = add(card, "div", "cluster c-life-" + (index + 1));
        var stage = add(cluster, "div", "stage");
        var photo = document.createElement("img");
        photo.src = item.image || "";
        photo.alt = item.name || "";
        stage.appendChild(photo);
        var copy = add(cluster, "div", "copy");
        var info = add(copy, "div", "info");
        add(info, "div", "brand", item.brand || "");
        add(info, "div", "name", item.name || "");
        add(info, "div", "detail", item.detail || "");
        var list = Number(item.listPrice) || 0;
        var price = Number(item.price) || 0;
        var discount = list > price && price > 0 ? Math.round((1 - price / list) * 100) : 0;
        var ticket = add(copy, "div", "ticket");
        var flags = add(ticket, "div", "flags");
        add(flags, "span", "off", discount ? "−" + discount + "%" : (item.badge || ""));
        var amount = add(ticket, "div", "price");
        add(amount, "span", "", "$");
        amount.appendChild(document.createTextNode(pesos(price)));
        if (discount) add(ticket, "div", "was", "antes $" + pesos(list));
      });
      customSlide.appendChild(rail);
    }

    function renderFeature(item) {
      if (!item || !item.name) return;
      var bg = item.bg || "#0c0c0e";
      var edge = item.edge || bg;
      var accent = item.accent || "#f47b20";
      var ink = item.ink || "#fff8f2";
      var glow = item.glow || accent;
      customSlide.style.background = bg;
      var root = add(customSlide, "div", "feature");
      root.style.color = accent;
      root.style.background = "linear-gradient(100deg, " + bg + ", " + edge + ")";
      root.style.setProperty("--accent", accent);
      root.style.setProperty("--ink", ink);
      root.style.setProperty("--glow", glow);
      var streaks = [
        ["feature-streak", "18%"],
        ["feature-streak is-wide", "44%"],
        ["feature-streak is-fast", "68%"],
        ["feature-streak is-thin", "84%"]
      ];
      for (var s = 0; s < streaks.length; s++) {
        var streak = add(root, "span", streaks[s][0]);
        streak.style.top = streaks[s][1];
      }
      var tops = ["16%", "30%", "52%", "63%", "78%", "90%"];
      for (var d = 0; d < tops.length; d++) {
        var dot = add(root, "span", "feature-dot");
        dot.style.top = tops[d];
        dot.style.animationDelay = (-d * 0.7) + "s";
      }
      var pass = add(root, "div", "feature-pass");
      var shot = add(pass, "div", "feature-shot");
      var photo = document.createElement("img");
      photo.src = item.image || "";
      photo.alt = "";
      shot.appendChild(photo);
      var copy = add(pass, "div", "feature-copy");
      if (item.brand) add(copy, "div", "feature-brand", item.brand);
      add(copy, "div", "feature-name", item.name);
      if (item.detail) add(copy, "div", "feature-detail", item.detail);
      var price = add(pass, "div", "feature-price");
      var current = Number(item.price) || 0;
      var list = Number(item.listPrice) || 0;
      add(price, "div", "feature-amount", "$" + pesos(current));
      if (list > current && current > 0) add(price, "div", "feature-was", "antes $" + pesos(list));
      var nameNode = copy.querySelector(".feature-name");
      fitFeatureName(pass, nameNode);
    }

    function fitFeatureName(pass, name) {
      if (!pass || !name) return;
      function measure() {
        var size = 22;
        name.style.fontSize = "22vh";
        var steps = 0;
        while (steps < 48 && size > 6.5 && pass.scrollWidth > pass.clientWidth + 2) {
          size -= 0.4;
          name.style.fontSize = size.toFixed(2) + "vh";
          steps += 1;
        }
      }
      measure();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    }

    function renderCustom(id) {
      var found = null;
      for (var i = 0; i < creations.length; i++) {
        if (creations[i].id === id) found = creations[i];
      }
      customSlide.innerHTML = "";
      customSlide.style.background = "";
      if (!found) return;
      if (found.template === "feature") {
        renderFeature(found.feature || {});
        return;
      }
      var gradient = found.gradient;
      if (gradient && gradient.on && gradient.from && gradient.to) {
        customSlide.style.background = "linear-gradient(" + gradient.angle + "deg, " + gradient.from + ", " + gradient.to + ")";
      } else if (found.background) {
        customSlide.style.background = found.background;
      }
      var accent = gradient && gradient.on ? gradient.to : (found.background || "#f47b20");
      if (found.wash || found.particles) {
        var fx = document.createElement("div");
        fx.className = "custom-fx" + (found.particles && found.fx ? " fx-" + found.fx : "");
        customSlide.style.setProperty("--wash", hexRgba(accent, 0.55));
        customSlide.style.setProperty("--glow", colorLight(accent) > 170 ? "#dd1d21" : "#ffffff");
        if (found.wash) {
          var wash = document.createElement("span");
          wash.className = "custom-wash";
          fx.appendChild(wash);
          var washBack = document.createElement("span");
          washBack.className = "custom-wash is-back";
          fx.appendChild(washBack);
        }
        if (found.particles) {
          for (var n = 0; n < 18; n++) {
            var mote = document.createElement("i");
            mote.style.left = ((n * 19) % 100) + "%";
            mote.style.animationDelay = (-n * 0.7) + "s";
            mote.style.animationDuration = (8 + (n % 6)) + "s";
            fx.appendChild(mote);
          }
          var beamTops = [4, 10, 16, 22, 28, 34, 40, 46, 52, 58, 64, 70, 76, 82, 88, 94];
          for (var b = 0; b < beamTops.length; b++) {
            var beam = document.createElement("span");
            beam.className = "custom-beam" + (b % 4 === 0 ? " is-wide" : b % 3 === 0 ? " is-thin" : b % 2 === 0 ? " is-fast" : "");
            beam.style.top = beamTops[b] + "%";
            beam.style.animationDuration = (2.2 + (b % 5) * 0.85) + "s";
            beam.style.animationDelay = (-b * 0.4) + "s";
            fx.appendChild(beam);
          }
          for (var s = 0; s < 64; s++) {
            var spark = document.createElement("span");
            spark.className = "custom-spark";
            spark.style.left = ((s * 17) % 100) + "%";
            spark.style.animationDuration = (3.2 + (s % 8) * 0.7) + "s";
            spark.style.animationDelay = (-(s % 13) * 0.45) + "s";
            var sparkSize = 4 + (s % 5) * 2;
            spark.style.width = sparkSize + "px";
            spark.style.height = sparkSize + "px";
            fx.appendChild(spark);
          }
          for (var m = 0; m < 28; m++) {
            var puff = document.createElement("span");
            puff.className = "custom-puff";
            puff.style.left = ((m * 13) % 100) + "%";
            var puffSize = 16 + (m % 6) * 8;
            puff.style.width = puffSize + "px";
            puff.style.height = puffSize + "px";
            puff.style.animationDuration = (6 + (m % 7)) + "s";
            puff.style.animationDelay = (-m * 0.55) + "s";
            fx.appendChild(puff);
          }
        }
        customSlide.appendChild(fx);
      }
      if (found.template === "products") {
        renderProductRail(found);
        return;
      }
      var pass = document.createElement("div");
      pass.className = "custom-pass";
      pass.style.animationDuration = (durations[id] || 10) + "s";
      for (var p = 0; p < found.pieces.length; p++) {
        var piece = found.pieces[p];
        var node = document.createElement("div");
        node.className = "custom-text";
        node.textContent = piece.text;
        node.style.left = piece.x + "%";
        node.style.top = piece.y + "%";
        node.style.fontFamily = piece.font;
        node.style.fontSize = piece.size + "vh";
        node.style.fontWeight = piece.bold ? "700" : "500";
        node.style.color = piece.color;
        if (piece.size >= 36) node.style.letterSpacing = "0.14em";
        if (piece.size < 36) {
          node.style.lineHeight = "1.8";
          node.style.padding = "0.12em 0 0.72em";
          node.style.overflow = "visible";
        }
        pass.appendChild(node);
      }
      customSlide.appendChild(pass);
    }

    function showId(id) {
      shown = id || "";
      var target = slideNodes[id] || (id ? customSlide : null);
      var nodes = [slideNodes.rail, slideNodes.offer, slideNodes.fresh, customSlide];
      for (var i = 0; i < nodes.length; i++) {
        var on = nodes[i] === target;
        if (on && nodes[i].className.indexOf("is-on") === -1) nodes[i].className += " is-on";
        if (!on) nodes[i].className = nodes[i].className.replace(" is-on", "");
      }
      if (target === customSlide && id) renderCustom(id);
    }

    function activeIds() {
      if (!playback.visible) return [];
      var out = [];
      for (var i = 0; i < order.length; i++) {
        if (playback[order[i]] !== false) out.push(order[i]);
      }
      return out;
    }

    function schedule() {
      if (advanceTimer) clearTimeout(advanceTimer);
      var active = activeIds();
      if (!active.length) {
        showId("");
        return;
      }
      if (active.indexOf(shown) === -1) showId(active[0]);
      if (active.length < 2) return;
      var wait = (durations[shown] || 5) * 1000;
      advanceTimer = setTimeout(function () {
        var next = activeIds();
        if (next.length < 2) {
          schedule();
          return;
        }
        var index = next.indexOf(shown);
        showId(next[(index + 1) % next.length]);
        schedule();
      }, wait);
    }

    function applyPlayback(data) {
      var items = data.elements || [];
      var nextOrder = [];
      var nextPlayback = { visible: data.visible !== false };
      var nextDurations = {};
      for (var i = 0; i < items.length; i++) {
        var id = items[i].id;
        nextOrder.push(id);
        nextPlayback[id] = items[i].visible !== false;
        var secs = parseInt(items[i].seconds, 10);
        nextDurations[id] = secs > 0 ? secs : 5;
      }
      var key = JSON.stringify({ visible: nextPlayback.visible, order: nextOrder, durations: nextDurations });
      playback = nextPlayback;
      durations = nextDurations;
      order = nextOrder;
      if (key === playbackKey) return;
      playbackKey = key;
      schedule();
    }

    function applyCreations(data) {
      var key = JSON.stringify(data);
      if (key === creationsKey) return;
      creationsKey = key;
      creations = data.items || [];
      if (shown && String(shown).charAt(0) === "c") renderCustom(shown);
    }

    function pullCreations() {
      fetch("/api/creations" + location.search, { cache: "no-store" })
        .then(function (response) { return response.json(); })
        .then(applyCreations)
        .catch(function () {});
    }

    function pullPlaylist() {
      fetch("/api/playlist", { cache: "no-store" })
        .then(function (response) { return response.json(); })
        .then(applyPlayback)
        .catch(function () {});
    }

    function lockedSlide() {
      var search = window.location.search;
      if (!search) return null;
      var parts = search.substring(1).split("&");
      for (var i = 0; i < parts.length; i++) {
        var pair = parts[i].split("=");
        if (pair[0] !== "slide") continue;
        var token = decodeURIComponent(pair[1] || "");
        if (/^c\d+$/.test(token)) return token;
        var n = parseInt(token, 10);
        if (String(n) === token && n >= 0 && n < slideIds.length) return slideIds[n];
      }
      return null;
    }

    function decodeValue(value) {
      if (!value) return null;
      if (Object.prototype.hasOwnProperty.call(value, "stringValue")) return value.stringValue;
      if (Object.prototype.hasOwnProperty.call(value, "integerValue")) return parseInt(value.integerValue, 10);
      if (Object.prototype.hasOwnProperty.call(value, "doubleValue")) return value.doubleValue;
      if (Object.prototype.hasOwnProperty.call(value, "booleanValue")) return value.booleanValue;
      if (Object.prototype.hasOwnProperty.call(value, "nullValue")) return null;
      if (value.arrayValue) {
        var values = value.arrayValue.values || [];
        var list = [];
        for (var i = 0; i < values.length; i++) list.push(decodeValue(values[i]));
        return list;
      }
      if (value.mapValue) {
        var fields = value.mapValue.fields || {};
        var obj = {};
        for (var key in fields) {
          if (Object.prototype.hasOwnProperty.call(fields, key)) obj[key] = decodeValue(fields[key]);
        }
        return obj;
      }
      return null;
    }

    var liveStamp = "";

    function applyLive(data) {
      var stamp = String(data.updatedAt || "");
      if (stamp && stamp === liveStamp) return;
      liveStamp = stamp;
      if (data.content) apply(data.content);
      if (data.elements) applyPieces(data.elements);
      if (data.creations) applyCreations(data.creations);
      if (data.playlist) applyPlayback(data.playlist);
    }

    function pullLive() {
      fetch("https://firestore.googleapis.com/v1/projects/banner-director-mixxo/databases/(default)/documents/state/live?key=AIzaSyBQob33_K4jHoHijlFNoDfs3A5NdTmSqYE")
        .then(function (response) { return response.json(); })
        .then(function (payload) {
          if (!payload || !payload.fields) return;
          applyLive(decodeValue({ mapValue: { fields: payload.fields } }));
        })
        .catch(function () {});
    }

    pull();
    setInterval(pull, 2500);
    pullPieces();
    setInterval(pullPieces, 2500);
    pullCreations();
    setInterval(pullCreations, 2500);
    pullPlaylist();
    setInterval(pullPlaylist, 2500);
    var locked = lockedSlide();
    if (locked !== null) showId(locked);
  </script>
</body>
</html>
